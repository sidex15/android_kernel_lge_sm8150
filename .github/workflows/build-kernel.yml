name: Build Kernel
run-name: ${{ inputs.input-run-name }}

on:
  workflow_dispatch:
    inputs:
      input-run-name:
        description: 'Run name (for internal use, optional)'
        required: false
        default: 'Manual Run'
      variant:
        description: 'Kernel variant'
        required: true
        type: choice
        options:
          - all
          - alpha
          - beta
          - flash
          - mh2lm
      ksu:
        description: 'KernelSU Next?'
        required: false
        type: choice
        options:
          - Include
          - Exclude
          - Both
        default: Exclude
      ksu-repo:
        description: 'KernelSU Next repository (if not using default)'
        required: false
        default: 'https://github.com/sidex15/KernelSU-Next'
      ksu-branch:
        description: 'KernelSU Next branch (if not using default)'
        required: false
        default: 'legacy-susfs-v2'
      build:
        description: 'Output format'
        required: false
        type: choice
        options:
          - anykernel
          - magisk
          - both
        default: anykernel
      jobs:
        description: 'Parallel jobs'
        required: false
        default: '24'

jobs:
  matrix-setup:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.set-matrix.outputs.variants }}
      ksu_check: ${{ steps.set-matrix.outputs.ksu_check }}
      builds: ${{ steps.set-matrix.outputs.builds }}
    steps:
      - name: Set matrix variables
        id: set-matrix
        run: |
          if [ "${{ inputs.variant }}" = "all" ]; then
            echo 'variants=["alpha","beta","flash","mh2lm"]' >> "$GITHUB_OUTPUT"
          else
            echo 'variants=["${{ inputs.variant }}"]' >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ inputs.ksu }}" = "Both" ]; then
            echo 'ksu_check=["Include","Exclude"]' >> "$GITHUB_OUTPUT"
          else
            echo 'ksu_check=["${{ inputs.ksu }}"]' >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ inputs.build }}" = "both" ]; then
            echo 'builds=["anykernel","magisk"]' >> "$GITHUB_OUTPUT"
          else
            echo 'builds=["${{ inputs.build }}"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: matrix-setup
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      matrix:
        variant: ${{ fromJson(needs.matrix-setup.outputs.variants) }}
        ksu: ${{ fromJson(needs.matrix-setup.outputs.ksu_check) }}
        build: ${{ fromJson(needs.matrix-setup.outputs.builds) }}
        exclude:
          - build: magisk
            ksu: Include
      fail-fast: false

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl wget \
            build-essential gcc make \
            bc bison flex \
            libssl-dev libelf-dev \
            libncurses5-dev \
            python3 \
            zip unzip \
            cpio \
            ccache \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf \
            lld \
            rsync \
            clang

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download Neutron Clang
        run: |
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S

      - name: Git Clone KernelSU Next Fork
        run: |
          git clone --depth 1 --branch ${{ inputs.ksu-branch }} ${{ inputs.ksu-repo }} KernelSU

      - name: Git Clone AnyKernel3/Magisk kernel installer
        run: |
          git clone --depth 1 --branch "${{ matrix.build }}" https://github.com/sidex15/n3x7g3n_anykernel3

      - name: Build kernel
        run: |
          ksu_flag=""
          if [ "${{ matrix.ksu }}" = "Include" ]; then
            ksu_flag="--ksu"
          fi
          bash ./build_kernel_docker_quick.sh \
            --variant "${{ matrix.variant }}" \
            $ksu_flag \
            --jobs "${{ inputs.jobs }}" \
            --build "${{ matrix.build }}" \
            --clang-path "$HOME/toolchains/neutron-clang/bin"

      - name: Copy built kernel to anykernel/magisk directory
        run: |
          variant="${{ matrix.variant }}"
          build="${{ matrix.build }}"
          ksu="${{ matrix.ksu }}"

          case "$variant" in
            alpha)  image_name="Image-alpha"; device_codename="#               LG G8                 #" ;;
            beta)   image_name="Image-beta"; device_codename="#               LG G8s                #" ;;
            flash)  image_name="Image"; device_codename="#               LG V50                #" ;;
            mh2lm)  image_name="Image-mh2lm"; device_codename="#            LG V50s-G8x              #" ;;
          esac

          if [ "$build" = "magisk" ]; then
            cp "release/Dragon/${image_name}.gz-dtb" "n3x7g3n_anykernel3/Image.gz-dtb"
          else
            cp "release/Dragon/${image_name}" "n3x7g3n_anykernel3/Image"
            # replace banner <device> with actual device name
            sed -i "s/#             LG <device>             #/${device_codename}/g" n3x7g3n_anykernel3/banner
            # replace n3x7g3n kernel line if KSU is included
            if [ "$ksu" = "Include" ]; then
              sed -i "s/#           n3x7g3n kernel            #/#    n3x7g3n kernel (KSUN + SUSFS)    #/g" n3x7g3n_anykernel3/banner
            fi
          fi

      - name: Determine artifact paths
        id: artifacts
        run: |
          variant="${{ matrix.variant }}"
          build="${{ matrix.build }}"

          ksu_flag=""
          if [ "${{ matrix.ksu }}" = "Include" ]; then
            ksu_flag="KSU"
          else
            ksu_flag="OpenELA"
          fi

          case "$variant" in
            alpha)  image_name="Image-alpha"; device_codename="G8" ;;
            beta)   image_name="Image-beta"; device_codename="G8s" ;;
            flash)  image_name="Image"; device_codename="V50" ;;
            mh2lm)  image_name="Image-mh2lm"; device_codename="V50s-G8x" ;;
          esac

          if [ "$build" = "magisk" ]; then
            artifact_path="release/Dragon/${image_name}.gz-dtb"
            build_suffix="magisk"
          else
            artifact_path="release/Dragon/${image_name}"
            build_suffix="anykernel3"
          fi

          echo "artifact_path=${artifact_path}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "device_codename=${device_codename}" >> "$GITHUB_OUTPUT"
          echo "ksu_flag=${ksu_flag}" >> "$GITHUB_OUTPUT"
          echo "build_suffix=${build_suffix}" >> "$GITHUB_OUTPUT"

      - name: Upload anykernel/magisk artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.artifacts.outputs.device_codename }}-n3x7g3n-${{ steps.artifacts.outputs.build_suffix }}-${{ steps.artifacts.outputs.ksu_flag }}"
          path: n3x7g3n_anykernel3/
          if-no-files-found: error
          retention-days: 30
